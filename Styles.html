<script>
// ── State ──────────────────────────────────────────────────
var APP = {
  state: {},
  session: null,
  currentView: 'home',
  notifOpen: false,
  notifications: [],
  unreadCount: 0
};

var VIEW_TITLES = {
  'home':'Home','browse':'Browse Tasks','leaderboard':'Leaderboard',
  'profile':'My Profile','kudos':'Submit Kudos','notifications':'Notifications',
  'task-detail':'Task Details','task-manager':'Task Manager','kudos-queue':'Kudos Queue',
  'demerit-entry':'Demerit Entry','analytics':'Team Analytics','agent-lookup':'Agent Lookup'
};

window.addEventListener('DOMContentLoaded', function() {
  loadSession();
  setupSearch();
  document.addEventListener('click', handleOutsideClick);
  if (localStorage.getItem('sidebarCollapsed') === 'true') {
    document.getElementById('sidebar').classList.add('collapsed');
  }
});

function toggleSidebar() {
  var sidebar = document.getElementById('sidebar');
  sidebar.classList.toggle('collapsed');
  localStorage.setItem('sidebarCollapsed', sidebar.classList.contains('collapsed'));
}

function loadSession() {
  google.script.run
    .withSuccessHandler(function(session) {
      APP.session = session;
      applySession(session);
      loadNotifications();
      renderView('home');
    })
    .withFailureHandler(function(err) { showToast('Failed to load session: ' + err.message, 'error'); })
    .getSessionInfo();
}

function applySession(session) {
  var initial = (session.displayName || session.ldap).charAt(0).toUpperCase();
  document.getElementById('sidebar-avatar-initial').textContent = initial;
  document.getElementById('sidebar-user-name').textContent = session.displayName || session.ldap;
  document.getElementById('sidebar-user-role').textContent = session.role;
  document.getElementById('header-avatar').textContent = initial;
  if (session.role === 'manager') {
    document.getElementById('manager-nav').style.display = 'block';
  }
}

function navigate(view, data) {
  closeNotifDropdown();
  document.querySelectorAll('.nav-item').forEach(function(el) {
    el.classList.toggle('active', el.dataset.view === view);
  });
  document.getElementById('header-title').textContent = VIEW_TITLES[view] || view;
  document.querySelectorAll('.view').forEach(function(el) { el.classList.remove('active'); });
  var viewEl = document.getElementById('view-' + view);
  if (viewEl) viewEl.classList.add('active');
  APP.currentView = view;
  renderView(view, data);
}

function renderView(view, data) {
  switch(view) {
    case 'home':          renderHome(); break;
    case 'browse':        renderBrowse(data); break;
    case 'leaderboard':   renderLeaderboard(); break;
    case 'profile':       renderProfile(data); break;
    case 'kudos':         renderKudosForm(); break;
    case 'notifications': renderNotificationsPage(); break;
    case 'task-detail':   renderTaskDetail(data); break;
    case 'task-manager':  renderTaskManager(); break;
    case 'kudos-queue':   renderKudosQueue(); break;
    case 'demerit-entry': renderDemeritEntry(); break;
    case 'analytics':     renderAnalytics(); break;
    case 'agent-lookup':  renderAgentLookup(data); break;
  }
}

function loadNotifications() {
  google.script.run
    .withSuccessHandler(function(result) {
      APP.notifications = result.notifications;
      APP.unreadCount = result.unreadCount;
      updateNotifBadge();
      renderNotifDropdown();
    })
    .withFailureHandler(function() {})
    .clientGetNotifications();
}

function updateNotifBadge() {
  var countEl = document.getElementById('notif-count');
  var sidebarEl = document.getElementById('sidebar-notif-count');
  if (APP.unreadCount > 0) {
    var label = APP.unreadCount > 99 ? '99+' : String(APP.unreadCount);
    countEl.textContent = label; countEl.classList.add('visible');
    sidebarEl.textContent = label; sidebarEl.classList.remove('hidden');
  } else {
    countEl.classList.remove('visible'); sidebarEl.classList.add('hidden');
  }
}

function toggleNotifDropdown() {
  APP.notifOpen = !APP.notifOpen;
  document.getElementById('notif-dropdown').classList.toggle('open', APP.notifOpen);
  if (APP.notifOpen) loadNotifications();
}

function closeNotifDropdown() {
  APP.notifOpen = false;
  document.getElementById('notif-dropdown').classList.remove('open');
}

function handleOutsideClick(e) {
  if (APP.notifOpen) {
    var dropdown = document.getElementById('notif-dropdown');
    var bell = document.querySelector('.notif-btn');
    if (!dropdown.contains(e.target) && !bell.contains(e.target)) closeNotifDropdown();
  }
}

function renderNotifDropdown() {
  var list = document.getElementById('notif-list');
  if (!APP.notifications || APP.notifications.length === 0) {
    list.innerHTML = '<div class="notif-empty">You\'re all caught up! 🎉</div>';
    return;
  }
  list.innerHTML = APP.notifications.map(function(n) {
    return '<div class="notif-item ' + (n.isRead ? '' : 'unread') + '" onclick="handleNotifClick(\'' + n.id + '\')">' +
      '<div class="notif-icon">' + n.icon + '</div>' +
      '<div class="notif-content"><div class="notif-msg">' + escHtml(n.message) + '</div>' +
      '<div class="notif-time">' + n.createdAt + '</div></div></div>';
  }).join('');
}

function handleNotifClick(notifId) { closeNotifDropdown(); }

function markAllRead() {
  google.script.run
    .withSuccessHandler(function() {
      APP.unreadCount = 0;
      APP.notifications.forEach(function(n) { n.isRead = true; });
      updateNotifBadge(); renderNotifDropdown();
      if (APP.currentView === 'notifications') renderNotificationsPage();
    })
    .withFailureHandler(function() {})
    .clientMarkNotificationsRead();
}

function setupSearch() {
  var input = document.getElementById('search-input');
  var timer;
  input.addEventListener('input', function() {
    clearTimeout(timer);
    var q = input.value.trim();
    if (!q) return;
    timer = setTimeout(function() { navigate('browse', { searchQuery: q }); }, 400);
  });
  input.addEventListener('keydown', function(e) {
    if (e.key === 'Enter') { clearTimeout(timer); var q = input.value.trim(); if (q) navigate('browse', { searchQuery: q }); }
  });
}

function showToast(message, type, duration) {
  var container = document.getElementById('toast-container');
  var toast = document.createElement('div');
  toast.className = 'toast ' + (type || '');
  toast.innerHTML = (type === 'success' ? '✓ ' : type === 'error' ? '✕ ' : '') + escHtml(message);
  container.appendChild(toast);
  setTimeout(function() {
    toast.style.opacity = '0'; toast.style.transform = 'translateX(20px)';
    toast.style.transition = 'all .25s ease';
    setTimeout(function() { toast.remove(); }, 250);
  }, duration || 3500);
}

function escHtml(str) {
  if (!str) return '';
  return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function getCategoryColor(category) {
  var colors = {'General':'#4285F4','Quality':'#01875f','Compliance':'#e65100','Training':'#7c4dff','Operations':'#f9ab00','Teamwork':'#00897b','Admin':'#5f6368'};
  return colors[category] || '#4285F4';
}

function getTierClass(tier) { return 'tier-' + (tier || 'bronze').toLowerCase(); }
function getDifficultyClass(difficulty) { return 'difficulty-' + (difficulty || 'easy').toLowerCase(); }
function renderTierBadge(tier) { return '<span class="tier-badge ' + getTierClass(tier) + '">' + (tier || 'Bronze') + '</span>'; }

function setLoading(viewId, message) {
  document.getElementById('view-' + viewId).innerHTML =
    '<div class="loading-state"><div class="spinner"></div><span>' + (message || 'Loading...') + '</span></div>';
}

function renderTaskCardHtml(task) {
  var catColor = getCategoryColor(task.category);
  var urgencyClass = 'urgency-' + (task.urgency || 'normal');
  var deadlineText = task.deadline || 'No deadline';
  var btnHtml = '';
  if (task.agentStatus === 'Completed') {
    btnHtml = '<div class="task-status-chip status-completed">✓ Completed</div>';
  } else if (task.agentStatus === 'In Progress') {
    btnHtml = '<div class="task-status-chip status-inprogress">● In Progress</div>';
  } else if (task.status === 'Expired' || task.urgency === 'expired') {
    btnHtml = '<div class="task-status-chip status-completed" style="cursor:not-allowed; opacity:0.7;">Task Expired</div>';
  } else {
    btnHtml = '<button class="task-status-chip status-available">▶ Claim Task</button>';
  }
  return '<div class="task-card" onclick="navigate(\'task-detail\', {taskId:\'' + task.id + '\'})">' +
    '<div class="task-card-top">' +
    '<div class="task-points">' + task.basePoints + '<span> pts</span></div>' +
    '<span class="task-difficulty ' + getDifficultyClass(task.difficulty) + '">' + (task.difficulty || 'Easy') + '</span>' +
    '</div>' +
    '<div class="task-title">' + escHtml(task.title) + '</div>' +
    '<div class="task-category" style="background:' + catColor + '20;color:' + catColor + '">' + escHtml(task.category) + '</div>' +
    '<div class="task-meta ' + urgencyClass + '">' +
    '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M11.99 2C6.47 2 2 6.48 2 12s4.47 10 9.99 10C17.52 22 22 17.52 22 12S17.52 2 11.99 2zM12 20c-4.42 0-8-3.58-8-8s3.58-8 8-8 8 3.58 8 8-3.58 8-8 8zm.5-13H11v6l5.25 3.15.75-1.23-4.5-2.67V7z"/></svg>' +
    deadlineText + '</div>' + btnHtml + '</div>';
}
</script>
